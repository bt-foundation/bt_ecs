name: Build Tasker

# Todo: Add matrix for build config and platform

on:
  push:
      branches:
        - dev
        - dev/**
        - feature/**
  pull_request:
      branches: 
        - main
        - dev

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false

    steps:
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 18

      - name: Configure with CMake (Visual Studio 18 2026)
        run: |
          mkdir "build"
          cd build
          cmake --preset "Windows Debug" ..\CMakeLists.txt

      - name: Build (Windows)
        run: cmake --build build/win64 --config Debug

      - name: Run tests
        working-directory: ${{github.workspace}}/build/win64
        run: ctest

  linux-build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Checkout repository
        uses: actions/checkout@v4
              
      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 16

      - name: Install dependencies
        run: |
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure (Linux)
        run: |
          cmake -S . -B build/linux64 -G Ninja

      - name: Build (Linux)
        run: | 
          cmake --build build/linux64 --config Release

      - name: Run tests
        working-directory: ${{github.workspace}}/build/linux64
        run: ctest
  
  wasm-build-and-test-plus-clang-tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false

    steps:
      - name: Setup emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y build-essential cmake

      - name: Build WASM
        run: emcmake cmake . -B build/wasm

      # Change name of the input .a library to match the projects name (same as in comple-wasm.bat)
      - name: Compile WASM
        run: |
          cmake --build build/wasm --target clean
          cmake --build build/wasm
          mkdir bin/wasm
          emcc -g build/wasm/libbt_template.a -o bin/wasm/template.js

      - name: Run tests
        working-directory: ${{github.workspace}}/build/wasm
        run: ctest

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '21'
          style: file
          auto-fix: 'true'
          tidy-checks: ''
          database: build/wasm
          files-changed-only: true
          step-summary: true
          tidy-review: true

      - name: Fail if clang-tidy reported anything
        if: steps.linter.outputs.clang-tidy-checks-failed > 0
        run: exit 1
      